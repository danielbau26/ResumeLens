[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resumelens"
version = "0.1.0"
description = "Formal language-based résumé screening (CyED3 Integrative Task 1)"
requires-python = ">=3.10"
dependencies = [
    "pyformlang",
    "textX",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
